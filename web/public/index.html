<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RERA Resolver — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>RERA Resolver</h1>
    <p class="tagline">
      State RERA portals only match exact spelling. Type the messy, human name you
      actually know a project by — see it resolved to the real registry record.
    </p>
  </header>

  <main>
    <section class="search">
      <div class="state-picker">
        <span class="state-picker-label">Registry</span>
        <div class="state-toggle" id="state-toggle" role="group" aria-label="Which state's RERA registry to search"></div>
      </div>
      <form id="search-form">
        <input id="name-input" type="text" placeholder="Project name" autocomplete="off" />
        <input id="promoter-input" type="text" placeholder="Developer name" autocomplete="off" />
        <button type="submit">Resolve</button>
      </form>
      <p class="search-hint" id="search-hint"></p>
      <div class="examples" id="examples"></div>
    </section>

    <section id="resolve-result" class="hidden"></section>
    <section id="dossier" class="hidden"></section>
  </main>

  <footer id="status-footer"></footer>

  <script src="app.js" type="module"></script>
</body>
</html>
