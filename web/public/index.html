<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RERA Resolver — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>RERA Resolver</h1>
    <p class="tagline">
      Karnataka's RERA portal only searches exact spelling. Type the messy, human name you
      actually know a project by — see it resolved to the real registry record.
    </p>
  </header>

  <main>
    <section class="search">
      <form id="search-form">
        <input id="name-input" type="text" placeholder="Project name, e.g. Godraj United" autocomplete="off" />
        <input id="promoter-input" type="text" placeholder="Developer name" autocomplete="off" />
        <button type="submit">Resolve</button>
      </form>
      <p class="search-hint" id="search-hint"></p>
      <div class="examples">
        Try:
        <button class="chip" data-name="Godraj United">Godraj United</button>
        <button class="chip" data-name="Lakeside Habitat" data-promoter="Prestige">Lakeside Habitat</button>
        <button class="chip" data-name="Brigade El Dorado">Brigade El Dorado</button>
        <button class="chip" data-promoter="Prestige Habitat Ventures">Just a developer name →</button>
      </div>
    </section>

    <section id="resolve-result" class="hidden"></section>
    <section id="dossier" class="hidden"></section>
  </main>

  <footer id="status-footer"></footer>

  <script src="app.js" type="module"></script>
</body>
</html>
